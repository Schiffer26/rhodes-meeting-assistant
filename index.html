<!doctype html>
<html lang="en" data-theme="terminal">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="RHODES — local-first meeting operations terminal. Prepare, document, and archive meetings entirely offline." />
    <title>RHODES — Meeting Operations Terminal</title>
    <style>
      html { background: #0f0f10; }
      #root { min-height: 100vh; }
    </style>
  </head>
  <body>
    <script>
      window.addEventListener('error', (e) => {
        document.body.innerHTML += `<div style="color:red; background:white; padding:20px; z-index:9999; position:absolute; top:0; left:0; width:100%; word-break:break-all; font-family:monospace;">${e.error ? e.error.stack : e.message}</div>`;
      });
      window.addEventListener('unhandledrejection', (e) => {
        document.body.innerHTML += `<div style="color:red; background:white; padding:20px; z-index:9999; position:absolute; top:0; left:0; width:100%; word-break:break-all; font-family:monospace;">${e.reason ? (e.reason.stack || e.reason) : 'Promise rejection'}</div>`;
      });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
